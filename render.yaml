# ==============================================================================
# Elevate Fitness & Nutrition Intelligence Platform
# Render Blueprint Specification (Infrastructure as Code)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Node.js API Gateway Service
  # ----------------------------------------------------------------------------
  - type: web
    name: elevate-node
    runtime: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_API_URL
        fromService:
          type: web
          name: elevate-python
          property: hostport
      - key: CORS_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Python FastAPI ML Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: elevate-python
    runtime: python
    rootDir: backend-python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. React SPA Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: static
    name: elevate-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://elevate-11.onrender.com/api
